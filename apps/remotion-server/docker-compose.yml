services:
  remotion-server:
    build:
      context: ../..
      dockerfile: apps/remotion-server/Dockerfile
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      - STUDIO_RENDER_SECRET
      - STUDIO_EDITOR_ORIGIN
      - STUDIO_PREVIEW_ORIGIN
      - NODE_ENV=production
      - PORT=3001
      - RENDERS_DIR=./renders
    volumes:
      - ${STUDIO_DATA_DIR:-../../.studio-data}:/app/.studio-data:ro
      # Mount renders directory for persistence
      - ./renders:/app/apps/remotion-server/renders
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
