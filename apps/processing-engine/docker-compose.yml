services:
  processing-engine:
    build: .
    container_name: video-processing-service
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
