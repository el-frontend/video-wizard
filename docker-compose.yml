networks:
  video-wizard-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  studio_data:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: video-wizard-postgres
    networks:
      - video-wizard-network
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set the local database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set the local database name}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot: apply Drizzle migrations, then exit. Web and worker wait for
  # this to complete successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: video-wizard-migrate
    networks:
      - video-wizard-network
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c 'pnpm auth:preflight && pnpm db:migrate'
    restart: 'no'

  # Python Processing Engine
  processing-engine:
    build:
      context: ./apps/processing-engine
      dockerfile: Dockerfile
    container_name: processing-engine
    networks:
      - video-wizard-network
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./apps/processing-engine/uploads:/app/uploads
      - ./apps/processing-engine/output:/app/output
      - ./apps/processing-engine:/app
    environment:
      STUDIO_RENDER_SECRET: ${STUDIO_RENDER_SECRET:?Set the private service secret}
      USE_OPENAI_API: ${USE_OPENAI_API:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  # Remotion Render Server
  remotion-server:
    init: true
    build:
      context: .
      dockerfile: apps/remotion-server/Dockerfile
    container_name: remotion-server
    networks:
      - video-wizard-network
    ports:
      - '127.0.0.1:3001:3001'
    # Chromium (via Remotion) needs a large /dev/shm; Docker's 64MB default
    # causes "cannot allocate memory" / "disk space low" render failures.
    shm_size: '2gb'
    environment:
      - STUDIO_RENDER_SECRET=${STUDIO_RENDER_SECRET:?Set the private service secret}
      - STUDIO_EDITOR_ORIGIN=${STUDIO_EDITOR_ORIGIN:-http://app.video-wizard.localhost:3000}
      - STUDIO_PREVIEW_ORIGIN=${STUDIO_PREVIEW_ORIGIN:-http://preview.video-wizard.localhost:3001}
      - NODE_ENV=production
      - PORT=3001
      - RENDERS_DIR=./renders
      # Cap concurrent Chromium tabs per render to bound memory in the
      # container (see REMOTION_PERFORMANCE.md). Raise/remove on hosts with
      # more RAM; leave unset to use Remotion's default (~half the cores).
      - RENDER_CONCURRENCY=2
      # Run up to 2 render jobs in parallel, matching the worker's dispatch
      # concurrency. Total Chromium tabs ≈ this × RENDER_CONCURRENCY (=4 here).
      - MAX_CONCURRENT_RENDERS=2
    volumes:
      - ./apps/remotion-server/renders:/app/apps/remotion-server/renders
      - studio_data:/app/.studio-data:ro
    depends_on:
      - processing-engine
    restart: unless-stopped

  # Web and worker use the workspace links installed in the image.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: video-wizard-web
    networks:
      - video-wizard-network
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.docker
    volumes:
      - studio_data:/app/.studio-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      processing-engine:
        condition: service_started
      remotion-server:
        condition: service_started
    restart: unless-stopped

  # Background worker — drains the task queue (renders, etc.).
  # Same image as web; only the command differs.
  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: video-wizard-worker
    networks:
      - video-wizard-network
    env_file:
      - .env.docker
    volumes:
      - studio_data:/app/.studio-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      remotion-server:
        condition: service_started
    command: pnpm worker
    restart: unless-stopped
