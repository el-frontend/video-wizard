networks:
  video-wizard-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  web_node_modules:
  web_app_node_modules:
  web_next_cache:
  worker_node_modules:
  worker_app_node_modules:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: video-wizard-postgres
    networks:
      - video-wizard-network
    ports:
      - '127.0.0.1:5432:5432'
    env_file:
      - .env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot: apply Drizzle migrations, then exit. Web and worker wait for
  # this to complete successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: video-wizard-migrate
    networks:
      - video-wizard-network
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm db:migrate
    restart: 'no'

  # Python Processing Engine
  processing-engine:
    build:
      context: ./apps/processing-engine
      dockerfile: Dockerfile
    container_name: processing-engine
    networks:
      - video-wizard-network
    ports:
      - '8000:8000'
    volumes:
      - ./apps/processing-engine/uploads:/app/uploads
      - ./apps/processing-engine/output:/app/output
      - ./apps/processing-engine:/app
    env_file:
      - ./apps/processing-engine/.env
    environment:
      - LOG_LEVEL=DEBUG
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  # Remotion Render Server
  remotion-server:
    build:
      context: .
      dockerfile: apps/remotion-server/Dockerfile
    container_name: remotion-server
    networks:
      - video-wizard-network
    ports:
      - '3001:3001'
    # Chromium (via Remotion) needs a large /dev/shm; Docker's 64MB default
    # causes "cannot allocate memory" / "disk space low" render failures.
    shm_size: '2gb'
    env_file:
      - ./apps/remotion-server/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - RENDERS_DIR=./renders
      - PYTHON_ENGINE_URL=http://processing-engine:8000
      # Cap concurrent Chromium tabs per render to bound memory in the
      # container (see REMOTION_PERFORMANCE.md). Raise/remove on hosts with
      # more RAM; leave unset to use Remotion's default (~half the cores).
      - RENDER_CONCURRENCY=2
    volumes:
      - ./packages/remotion-compositions:/app/packages/remotion-compositions
      - ./apps/remotion-server/server:/app/apps/remotion-server/server
      - ./apps/remotion-server/renders:/app/apps/remotion-server/renders
      - ./apps/processing-engine/output:/app/processing-engine/output
    depends_on:
      - processing-engine
    restart: unless-stopped
    command: pnpm dev

  # Next.js web app (dev mode, hot reload via mounted source).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: video-wizard-web
    networks:
      - video-wizard-network
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    volumes:
      # Hot reload: mount source. node_modules and .next stay inside the
      # container (named volumes) so pnpm install isn't re-run on every up.
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next_cache:/app/apps/web/.next
    depends_on:
      migrate:
        condition: service_completed_successfully
      processing-engine:
        condition: service_started
      remotion-server:
        condition: service_started
    restart: unless-stopped

  # Background worker — drains the task queue (renders, etc.).
  # Same image as web; only the command differs.
  worker:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: video-wizard-worker
    networks:
      - video-wizard-network
    env_file:
      - .env.docker
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - worker_node_modules:/app/node_modules
      - worker_app_node_modules:/app/apps/web/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      remotion-server:
        condition: service_started
    command: pnpm worker
    restart: unless-stopped
